name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Opens or updates the release PR from conventional commits on main. Merging
  # that PR bumps the version, updates CHANGELOG.md, tags and creates the
  # GitHub release; the publish job below then ships it to npm. Tags made with
  # GITHUB_TOKEN do not trigger workflows, so publishing has to happen here.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  publish:
    # A release from release-please, or a manually pushed v* tag.
    if: ${{ !cancelled() && needs.test.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.release.outputs.created == 'true') }}
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Skip if this version is already on npm
        id: check
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      # Trusted publishing: npm trusts this workflow through GitHub OIDC, so no
      # token is stored. Needs npm 11.5.1+, and the workflow registered as a
      # trusted publisher in the package settings on npmjs.com.
      - if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
